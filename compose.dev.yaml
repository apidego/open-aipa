# Standalone development stack: docker compose -f compose.dev.yaml up --build -d
services:
  app:
    build:
      context: .
      target: development
    init: true
    env_file: ${PA_ENV_FILE:-.env}
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      HOST: 127.0.0.1
      PORT: 3000
      DATA_DIR: /app/data
      # Reliable file watching across Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    ports:
      - '127.0.0.1:3000:5173'
    volumes:
      - .:/app
      - dev-dependencies:/app/node_modules
      - dev-npm-cache:/home/node/.npm
      - ${PA_DATA_VOLUME:-pa-data}:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
volumes:
  pa-data:
  dev-dependencies:
  dev-npm-cache:

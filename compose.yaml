services:
  app:
    image: openaipa:local
    build: .
    restart: unless-stopped
    init: true
    env_file: ${PA_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - '${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLISH_PORT:-3000}:3000'
    volumes:
      - ${PA_DATA_VOLUME:-pa-data}:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pa-data:
